[mypy]
python_version = 3.12
packages = rana_qgis_plugin
exclude = rana_qgis_plugin/legacy/.*

ignore_missing_imports = True
check_untyped_defs = True
disallow_untyped_defs = False

[mypy-rana_qgis_plugin.legacy.*]
ignore_errors = True

# Moved out of legacy/ verbatim (git mv, pending adaptation as part of
# feat_454_open_generic_files); carry the same exemption legacy.* had until
# these are actually rewritten. Remove these entries once each file is
# adapted for the new architecture.
[mypy-rana_qgis_plugin.workers.download]
ignore_errors = True

# Moved out of legacy/simulation/ verbatim (git mv, as part of
# feat_452_open_schema). utils.py, utils_ui.py,
# load_schematisation/schematisation_load_local.py and
# upload_wizard/upload_wizard.py have been adapted and are fully type-checked
# below. The remaining modules are simulation-running code not touched by
# feat_452_open_schema; carry the same exemption legacy.* had until each is
# adapted (remove its entry here once fixed). threedi_calls.py predates the
# move and was already clean.
[mypy-rana_qgis_plugin.simulation.workers]
ignore_errors = True

[mypy-rana_qgis_plugin.simulation.simulation_wizard]
ignore_errors = True

[mypy-rana_qgis_plugin.simulation.data_models.simulation_data_models]
ignore_errors = True

[mypy-rana_qgis_plugin.simulation.substance_concentrations]
ignore_errors = True

[mypy-rana_qgis_plugin.simulation.initial_concentrations]
ignore_errors = True

[mypy-rana_qgis_plugin.simulation.simulation_init]
ignore_errors = True

[mypy-rana_qgis_plugin.simulation.model_selection]
ignore_errors = True

[mypy-rana_qgis_plugin.simulation.upload_wizard.model_deletion]
ignore_errors = True

[mypy-rana_qgis_plugin.utils.*]
disallow_untyped_defs = True
